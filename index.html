<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f6f8fb;
      color: #0f172a;
      text-align: center;
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border: 1px solid #d4dde6;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    .status {
      font-size: 15px;
      margin-top: 12px;
      min-height: 24px;
    }
    .heard {
      margin-top: 16px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      min-height: 48px;
      white-space: pre-wrap;
    }
    .stop {
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e2e8f0;
      color: #0f172a;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Listening…</h2>
    <div class="status" id="status">Opening microphone…</div>
    <div class="heard" id="heard">Say item, bay, or control number</div>
    <button class="stop" id="stopBtn">Cancel</button>
  </div>

  <script>
    let recognition = null;
    let finalTranscript = '';
    let hasSentResult = false;

    const statusEl = document.getElementById('status');
    const heardEl  = document.getElementById('heard');

    function setStatus(text) {
      statusEl.textContent = text;
      console.log(text);
    }

    function sendToParent(payload) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, '*');
      }
    }

    function closePopup(type = 'VOICE_CLOSED') {
      sendToParent({ type });
      setTimeout(() => window.close(), 100);
    }

    async function startMic() {
      try {
        setStatus('Requesting microphone access...');

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          throw new Error('Speech recognition is not supported in this browser');
        }

        recognition = new SR();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          setStatus('Listening now...');
        };

        recognition.onresult = (event) => {
          let transcript = '';
          let isFinal = false;

          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
            if (event.results[i].isFinal) isFinal = true;
          }

          heardEl.textContent = transcript || 'Listening...';

          if (isFinal && transcript.trim() && !hasSentResult) {
            hasSentResult = true;
            finalTranscript = transcript.trim();

            setStatus('Got it. Sending result...');
            sendToParent({
              type: 'VOICE_RESULT',
              transcript: finalTranscript
            });

            try {
              recognition.stop();
            } catch (e) {}

            setTimeout(() => window.close(), 250);
          }
        };

        recognition.onerror = (event) => {
          console.error('Speech error:', event.error);

          sendToParent({
            type: 'VOICE_ERROR',
            error: event.error,
            details: 'SpeechRecognition error'
          });

          setStatus('Error: ' + event.error);
          setTimeout(() => window.close(), 800);
        };

        recognition.onend = () => {
          if (!hasSentResult) {
            sendToParent({
              type: 'VOICE_ERROR',
              error: 'NO_SPEECH',
              details: 'No final transcript received'
            });
            setTimeout(() => window.close(), 400);
          }
        };

        recognition.start();

      } catch (err) {
        console.error('Mic failed:', err);
        sendToParent({
          type: 'VOICE_ERROR',
          error: err.name || 'MIC_ERROR',
          details: err.message || ''
        });
        setStatus('Mic failed: ' + (err.message || err.name || 'unknown error'));
        setTimeout(() => window.close(), 1200);
      }
    }

    document.getElementById('stopBtn').addEventListener('click', () => {
      try {
        if (recognition) recognition.stop();
      } catch (e) {}
      closePopup('VOICE_CLOSED');
    });

    window.addEventListener('beforeunload', function () {
      sendToParent({ type: 'VOICE_CLOSED' });
    });

    // Auto-start immediately when popup opens
    window.addEventListener('load', startMic);
  </script>
</body>
</html>
